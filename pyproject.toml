[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-dash-tui"
version = "0.1.0"
description = "Customized multi-pane terminal TUI dashboard for daily life: MacBook & system htop monitor, Google Home devices, tasks & emails, calendar, weather, and community-favorite widgets."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "marchevskiy"}
]
dependencies = [
    "textual>=0.80.0",
    "rich>=13.7.0",
    "psutil>=5.9.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0.0",
    "pychromecast>=13.0.0",
    "zeroconf>=0.131.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
dailydash = "daily_dash.cli:main"
daily-dash = "daily_dash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
